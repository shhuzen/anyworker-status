  allSystemsOperational: Все сервисы работают
  incidentReport: "Сбой №$NUMBER: подробности →"
  activeIncidentSummary: Начался $DATE, сообщений — $POSTS
  incidentTitle: Сбой №$NUMBER
  incidentDetails: Подробности сбоя
  incidentFixed: Исправлен
  incidentOngoing: Продолжается
  incidentOpenedAt: Начался
  incidentClosedAt: Закончился
  incidentViewOnGitHub: Открыть на GitHub и подписаться
  incidentCommentSummary: "$DATE, $AUTHOR"
  incidentBack: ← Все сбои
  pastIncidents: Прошлые сбои
  pastIncidentsResolved: Исправлен за $MINUTES мин, сообщений — $POSTS
  liveStatus: Сервисы сейчас
  overallUptime: "Доступность: $UPTIME"
  overallUptimeTitle: Доступность
  averageResponseTime: "Средний ответ: $TIME мс"
  averageResponseTimeTitle: Средний ответ
  sevelDayResponseTime: Время ответа за последние дни

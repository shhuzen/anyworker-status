  rateLimitExceededHasSet: Токен доступа сохранён.
  rateLimitExceededRemoveToken: Убрать токен
  rateLimitExceededGitHubPAT: Токен доступа GitHub
  rateLimitExceededCopyPastePAT: Вставьте токен
  rateLimitExceededSaveToken: Сохранить токен
  errorTitle: Не получилось загрузить данные
  errorIntro: Свежие данные о сервисах сейчас не загрузились.
  errorText: Обновите страницу через минуту.

owner: shhuzen
repo: anyworker-status

sites:
  - name: anyworker.ai
    url: https://anyworker.ai
  - name: App readiness
    url: https://anyworker.ai/readyz
  - name: App liveness
    url: https://anyworker.ai/healthz
  - name: Deploy panel
    url: https://admin.anyworker.ai
  - name: Error tracker
    url: https://errors.anyworker.ai
  - name: Files (Nextcloud)
    url: https://disk.anyworker.ai
    expectedStatusCodes: [200, 301, 302]
  - name: Mail
    url: https://mail.anyworker.ai
    expectedStatusCodes: [200, 301, 302]

status-website:
  baseUrl: /anyworker-status
  name: Статус anyworker.ai
  logoUrl: https://shhuzen.github.io/anyworker-status/anyworker-logo.svg
  faviconSvg: https://shhuzen.github.io/anyworker-status/anyworker-logo.svg
  # The look lives in assets/theme.css (anyworker.ai colours and fonts)
  themeUrl: https://shhuzen.github.io/anyworker-status/theme.css?v=4
  links:
    - rel: preconnect
      href: https://fonts.gstatic.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=DotGothic16&family=Roboto:wght@400;500;700&display=swap
  # Incidents and response times come from saved files, not from the GitHub API
  # (60 requests an hour per address) - see assets/aw-api-cache.js
  scripts:
    - src: https://shhuzen.github.io/anyworker-status/aw-api-cache.js
  # A service page has no title of its own, the tab showed the bare address
  js: "if(typeof document!=='undefined'&&!document.title)document.title='Статус anyworker.ai';"
  introTitle: "Статус сервисов **anyworker.ai**"
  introMessage: Проверяем каждые пять минут с серверов GitHub. Если сервис перестаёт отвечать, здесь появляется запись о сбое, а нам приходит сообщение в Telegram.
  navbar:
    - title: Все сервисы
      # with baseUrl a bare "/" leads to shhuzen.github.io itself, which is not this site
      href: /anyworker-status/
    - title: Сайт
      href: https://anyworker.ai

# Colours of the response-time chart on a service page
graphBackgroundColor: "rgba(208, 188, 255, 0.18)"
graphBorderColor: "#d0bcff"

# Texts of the status page (and a few words in the README table)
i18n:

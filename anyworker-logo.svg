<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="180" height="180" role="img" aria-label="anyworker.ai">
  <!--
    The brand mark: the "A" of anyworker.ai, drawn as a network — three strokes
    and five nodes, the agents the product is about.

    Fixed colours here, unlike components/Landing/LogoMark.vue which paints from
    the brand tokens: this file is served as an <img> — it is the default behind
    /media/logo/{slot} — and an <img> cannot see the page's custom properties.

    So it is drawn the way the source design draws the mark at icon sizes: a
    filled accent tile with the mark reversed out of it, rather than a bare blue
    mark. The tile brings its own ground, which is what lets one static file sit
    on the light dashboard rail and on a dark surface without a second asset and
    without disappearing into either.
  -->
  <rect width="64" height="64" rx="14" fill="#3E63DD"/>
  <g transform="translate(32 32) scale(0.62) translate(-32 -31)">
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
      <line x1="32" y1="10" x2="16" y2="52"/>
      <line x1="32" y1="10" x2="48" y2="52"/>
      <line x1="23" y1="36" x2="41" y2="36"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="32" cy="10" r="4.5"/>
      <circle cx="16" cy="52" r="4.5"/>
      <circle cx="48" cy="52" r="4.5"/>
      <circle cx="23" cy="36" r="4.5"/>
      <circle cx="41" cy="36" r="4.5"/>
    </g>
  </g>
</svg>
